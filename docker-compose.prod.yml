# JF Production — JobFinder service

networks:
  backend:
    name: docker_backend
    external: true
  frontend:
    name: docker_frontend
    external: true

services:
  jobfinder:
    image: jobfinder:latest
    container_name: jobfinder
    mem_limit: 1g
    restart: unless-stopped
    ports:
      - "127.0.0.1:3456:3456"
    # depends_on pg from infra compose
    # ensure infra is running: cd /opt/docker && docker compose up -d
    env_file:
      - /opt/docker/secrets/.jobfinder.env
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      # Fix: cloudflared "stream canceled by remote with error code 0"
      # Next.js default keepAliveTimeout=5s causes CF to reuse dead connections → CANCEL
      # Set to 120s > cloudflared originRequest.keepAliveTimeout=90s so CF closes idle first
      - KEEP_ALIVE_TIMEOUT=120000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3456/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - backend
      - frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
