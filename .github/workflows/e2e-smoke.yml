name: E2E Smoke

# Wave 2 (TES-20260610-0001): read-only Playwright smoke against prod
# (https://jobfinder.taras.cloud) on every push to main, every 6 hours,
# and on demand. Runs ONLY tests/smoke.spec.ts via the `smoke` project
# (read-only: health endpoint + unauthenticated login page render).

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: JF prod E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run smoke tests (read-only, prod)
        # `smoke` project defaults baseURL to https://jobfinder.taras.cloud
        run: npx playwright test --project=smoke
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
